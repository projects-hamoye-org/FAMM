name: WIF smoke test

# Manual check that GitHub Actions can authenticate to famm-472015 through
# Workload Identity Federation and use Earth Engine as the service account,
# with no personal credentials involved.

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write             # needed for Workload Identity Federation

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Earth Engine API
        run: pip install earthengine-api==1.6.12 numpy==1.26.3

      - name: Test Earth Engine access
        run: |
          python - << 'EOF'
          import datetime
          import ee
          import google.auth

          creds, _ = google.auth.default(scopes=[
              "https://www.googleapis.com/auth/earthengine",
              "https://www.googleapis.com/auth/cloud-platform",
          ])
          ee.Initialize(credentials=creds, project="famm-472015")
          print("1. Initialised as service account")

          assert ee.Number(1).add(1).getInfo() == 2
          print("2. getInfo works")

          # Small Sentinel-2 pull near Tarkwa, same method the new export will use
          point = ee.Geometry.Point([-1.99, 5.30])
          img = (ee.ImageCollection("COPERNICUS/S2_SR_HARMONIZED")
                 .filterBounds(point)
                 .filterDate(str(datetime.date.today() - datetime.timedelta(days=60)),
                             str(datetime.date.today()))
                 .select(["B4", "B8"])
                 .median())
          arr = ee.data.computePixels({
              "expression": img,
              "fileFormat": "NUMPY_NDARRAY",
              "grid": {
                  "dimensions": {"width": 64, "height": 64},
                  "affineTransform": {"scaleX": 10, "shearX": 0, "translateX": 611000,
                                      "shearY": 0, "scaleY": -10, "translateY": 586000},
                  "crsCode": "EPSG:32630",
              },
          })
          print(f"3. computePixels works: {arr.shape}, bands {arr.dtype.names}")
          print("All checks passed")
          EOF

      - name: Check focal gap-fill kernel size
        run: |
          python - << 'EOF'
          # Does focal_mean(1, 'square', 'meters') / focal_median(2, ...) at
          # 10 m behave as 3x3 / 5x5, as the paper states? Punch a hole in a
          # constant image and see whether the fills close it.
          import ee, google.auth
          creds, _ = google.auth.default(scopes=[
              "https://www.googleapis.com/auth/earthengine",
              "https://www.googleapis.com/auth/cloud-platform",
          ])
          ee.Initialize(credentials=creds, project="famm-472015")

          X, Y = 611000, 586000          # top-left of a 5x5 grid of 10 m pixels
          def hole(n):                   # n x n hole centred on pixel (2, 2)
              h = (n * 10 - 2) / 2
              rect = ee.Geometry.Rectangle([X + 25 - h, Y - 25 - h, X + 25 + h, Y - 25 + h],
                                           "EPSG:32630", False)
              return ee.Image(1).paint(ee.FeatureCollection([ee.Feature(rect)]), 0)

          img = ee.Image.constant(1).toFloat()
          out = {}
          for units in ["meters", "pixels"]:
              a = img.updateMask(hole(1))
              out[f"1px_hole_{units}_mean"] = a.unmask(a.focal_mean(1, "square", units)).mask()
              b = img.updateMask(hole(3))
              b1 = b.unmask(b.focal_mean(1, "square", units))
              out[f"3px_hole_{units}_mean"] = b1.mask()
              out[f"3px_hole_{units}_mean_then_median"] = b1.unmask(b1.focal_median(2, "square", units)).mask()
          stack = ee.Image.cat([v.rename(k) for k, v in out.items()])
          arr = ee.data.computePixels({
              "expression": stack, "fileFormat": "NUMPY_NDARRAY",
              "grid": {"dimensions": {"width": 5, "height": 5},
                       "affineTransform": {"scaleX": 10, "shearX": 0, "translateX": X,
                                           "shearY": 0, "scaleY": -10, "translateY": Y},
                       "crsCode": "EPSG:32630"},
          })
          print("Centre pixel filled? (1 = yes, 0 = no)")
          print("Expected for true 3x3 mean / 5x5 median: 1px_mean=1, 3px_mean=0, 3px_mean_then_median=1")
          for k in out:
              print(f"  {k:38s} {float(arr[k][2, 2]):.0f}")
          EOF

      - name: Count unfilled gaps in training/test composites
        run: |
          python - << 'EOF'
          # For each published composite: what fraction of AOI pixels is empty,
          # and how many empty pixels touch a valid neighbour (a working 3x3
          # fill would have closed every one of those)?
          import ee, google.auth
          creds, _ = google.auth.default(scopes=[
              "https://www.googleapis.com/auth/earthengine",
              "https://www.googleapis.com/auth/cloud-platform",
          ])
          ee.Initialize(credentials=creds, project="famm-472015")

          BANDS = ["B2", "B3", "B4", "B5", "B6", "B7", "B8", "B8A", "B11", "B12"]
          # AOI from scraping/patch_extraction.py, shrunk 2 km so the
          # composite's own outer edge is not counted as a gap.
          aoi = ee.Geometry.Polygon([[
              [-2.577107401987939, 6.5306601480568975], [-2.903948285164646, 6.2932353613892245],
              [-2.9766815269095392, 6.08434089968068], [-2.90664378427828, 5.908201200818874],
              [-2.8077586698808297, 5.711522903619994], [-2.4782606507938705, 5.339810442902648],
              [-2.1734693858250353, 4.984296847965302], [-1.5720532810091514, 5.121001314357858],
              [-0.9295708164086846, 5.421854403720199], [-1.436961333748421, 6.219931255643865],
              [-1.3346584712677179, 6.530992048541554], [-1.415359587336964, 6.779274372062422],
              [-1.6499660314807807, 6.831115397308761]]]).buffer(-2000)

          N = 20000
          def check(img):
              valid = img.select(BANDS).mask().reduce(ee.Reducer.min()).gt(0)
              fillable = valid.Not().And(valid.focal_max(1, "square", "pixels"))
              s = (valid.rename("valid").addBands(fillable.rename("fillable"))
                   .sample(region=aoi, scale=10, projection="EPSG:32630",
                           numPixels=N, seed=0, dropNulls=False))
              return ee.Feature(None, {
                  "id": img.get("system:index"),
                  "n": s.size(),
                  "empty": ee.Number(1).subtract(s.aggregate_mean("valid")),
                  "fillable": s.aggregate_mean("fillable"),
              })

          for asset in ["projects/famm-472015/assets/Ghana_ASM_Bimonthly",
                        "projects/famm-472015/assets/2025_Composites_"]:
              try:
                  col = ee.ImageCollection(asset)
                  rows = col.map(check).getInfo()["features"]
              except Exception as e:
                  print(f"{asset}: could not read ({str(e)[:150]})")
                  continue
              print(f"\n{asset} ({len(rows)} composites, ~{N} sampled pixels each)")
              print(f"  {'composite':40s} {'empty %':>8s} {'fillable %':>11s}")
              for r in rows:
                  p = r["properties"]
                  if p.get("empty") is None:
                      print(f"  {str(p.get('id'))[:40]:40s} no pixels sampled")
                      continue
                  print(f"  {str(p['id'])[:40]:40s} {100 * p['empty']:8.3f} {100 * p['fillable']:11.3f}")
          print("\nfillable % > 0 means gaps a working 3x3 fill would have closed are present.")
          EOF
